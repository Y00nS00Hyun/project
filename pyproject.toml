[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-processing-poc"
version = "0.1.0"
description = "HWP/HWPX parsing PoC for the internal document management system"
requires-python = ">=3.10"

# Runtime dependencies are deliberately minimal.
# See docs/poc/hwp-poc-report.md section 11 for the license review behind this list.
dependencies = [
    "olefile>=0.46",  # BSD-2-Clause. CFB (OLE compound file) reader used by the HWP 5.x parser.
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

# HTTP API layer.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.1",
]

# Production LLM provider. Optional: the default provider makes no external
# call at all, and LLM_PROVIDER must explicitly select "anthropic" before this
# is used. Requires organizational approval before internal documents are sent.
llm = [
    "anthropic>=1.4",
]

# Database migration tooling. Not required by the parser/PoC code.
db = [
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires real HWP/HWPX fixture files",
]
