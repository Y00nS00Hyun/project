# Single-VM deployment.
#
# Only the frontend publishes a host port. PostgreSQL and FastAPI are reachable
# solely on the internal compose network, so the only way to the API is through
# nginx -- which is also what makes the deployment same-origin and keeps the
# backend's CORS allow-list empty.

name: docsearch

# A single VM with no log shipper: without a cap, json-file logs grow until the
# disk is full.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # -------------------------------------------------------------------------
  # PostgreSQL 16 + pgvector
  # -------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # C.utf8, NOT plain C.
      #
      # pg_trgm decides what a word character is using the database's ctype.
      # Under the C locale, multibyte Korean characters are not word
      # characters, so show_trgm('예산') returns an empty array and the whole
      # lexical retrieval route silently matches nothing -- no error, just zero
      # results forever. C.utf8 keeps collation deterministic (no ICU/system
      # locale drift between image versions) while still classifying Korean
      # correctly. Verified: word_similarity('사업비', '총 사업비는 3억원...')
      # is 0.000 under C and 0.750 under C.utf8.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.utf8"
    volumes:
      # Named volume, so `docker compose down` keeps the data.
      - postgres_data:/var/lib/postgresql/data
    # No `ports:`. Deliberate -- see the header comment.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Schema migration (one-shot)
  # -------------------------------------------------------------------------
  # Runs alembic once and exits. The API never migrates on startup: several
  # uvicorn processes racing `upgrade head` against one database is how a
  # half-applied schema happens.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: docsearch-backend:local
    # Never restart. A failed migration must stay failed and visible, and a
    # restart loop would retry a broken upgrade forever.
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  # -------------------------------------------------------------------------
  # FastAPI
  # -------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: docsearch-backend:local
    restart: unless-stopped
    environment:
      # Anything outside the non-production set makes require_user() reject
      # every request: there is no SSO yet, so production fails closed.
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      SHARED_ROOT: ${SHARED_ROOT:-/data/shared}

      # Body exact-match ranking boost. Defaults match the measured values;
      # weight 0 restores the previous ranking exactly. The selectivity ceiling
      # is provisional -- see .env.example.
      BODY_EXACT_BOOST_WEIGHT: ${BODY_EXACT_BOOST_WEIGHT:-0.10}
      BODY_EXACT_SELECTIVITY_MAX: ${BODY_EXACT_SELECTIVITY_MAX:-0.50}

      # Who may read a document the moment it is ingested. Defaults to "none"
      # -- documents readable by nobody is a mistake that gets noticed; a
      # corpus published by accident is not.
      DOCUMENT_DEFAULT_ACCESS: ${DOCUMENT_DEFAULT_ACCESS:-none}

      # Read from the read-only mount below. Never downloaded at runtime.
      EMBEDDING_CACHE_DIR: ${EMBEDDING_CACHE_DIR:-/opt/model-cache}
      # The chunking tokenizer calls AutoTokenizer.from_pretrained() without a
      # cache_dir, so it resolves through HF_HUB_CACHE rather than
      # EMBEDDING_CACHE_DIR. Both must point at the same snapshot.
      HF_HUB_CACHE: ${EMBEDDING_CACHE_DIR:-/opt/model-cache}

      # Empty by default. The provider stays UnconfiguredProvider and no
      # request leaves the network; an API key present in the environment is
      # not enough on its own to turn generation on.
      # Development-only local login. Both default to off, and both are
      # ignored outside a non-production APP_ENV, so a production deployment
      # cannot acquire a password login by copying an .env file.
      LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-false}
      SELF_SIGNUP_ENABLED: ${SELF_SIGNUP_ENABLED:-false}
      LOCAL_AUTH_SESSION_DAYS: ${LOCAL_AUTH_SESSION_DAYS:-7}
      # The session cookie is Secure only where there is TLS to be secure over.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}

      # Second gate, defaulting to off. An operator who copies a provider and
      # a key into .env has still not authorised sending internal documents
      # anywhere; that takes setting this as well.
      DOCUMENT_EXTERNAL_LLM_ENABLED: ${DOCUMENT_EXTERNAL_LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-}
      ANTHROPIC_TIMEOUT_SECONDS: ${ANTHROPIC_TIMEOUT_SECONDS:-}
      ANTHROPIC_MAX_RETRIES: ${ANTHROPIC_MAX_RETRIES:-}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-}

      # Same-origin through nginx, so no browser origin needs allowing.
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
    volumes:
      # Read-only, always. The system is a reader of the shared folder: it must
      # not be able to modify, delete, rename or move an original document.
      - ${SHARED_FOLDER_HOST_PATH:?set SHARED_FOLDER_HOST_PATH in .env}:/data/shared:ro
      # Pre-populated model cache, also read-only.
      - ${EMBEDDING_CACHE_HOST_PATH:?set EMBEDDING_CACHE_HOST_PATH in .env}:/opt/model-cache:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # API Contract v1 defines no /health route and this deployment does not add
    # one: a TCP connect proves the server is accepting connections without
    # putting a new endpoint on the public contract.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # No `ports:`. Reachable only via nginx.
    logging: *default-logging

  # -------------------------------------------------------------------------
  # React build + nginx (the only host-published service)
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: docsearch-frontend:local
    restart: unless-stopped
    ports:
      - "${APP_HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *default-logging

volumes:
  postgres_data:
