# Alembic configuration for the internal document management system.
#
# The database URL is NOT stored here. It is read from the DATABASE_URL
# environment variable in migrations/env.py so that credentials never end up in
# the repository.
#
#   export DATABASE_URL=postgresql+psycopg://user:pass@host:5432/dbname
#   alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Timestamped, ordered filenames so the version history reads chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
