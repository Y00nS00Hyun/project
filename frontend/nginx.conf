# Same-origin front door: static React at /, FastAPI at /api/.
#
# The browser only ever sees this one origin, so no CORS request is made and
# the backend's allow-list stays empty in production.

upstream backend {
    # Compose service name on the internal network. The backend publishes no
    # host port; this is the only way in.
    server backend:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx build.
    server_tokens off;

    # Uploads are not part of this API, but a document download can be large.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------------------
    # API
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The API generates a request id when the client sends none and echoes
        # it back in X-Request-Id. Passing the inbound value through keeps a
        # client-supplied correlation id intact instead of splitting one
        # request across two ids.
        proxy_set_header X-Request-Id      $http_x_request_id;
        proxy_pass_header X-Request-Id;

        # A download streams a file; buffering it whole would hold it in memory
        # and delay the first byte.
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---------------------------------------------------------------------
    # Static assets
    # ---------------------------------------------------------------------
    # Vite emits content-hashed filenames under /assets, so they can be cached
    # indefinitely. index.html must not be, or a deploy would not be picked up.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---------------------------------------------------------------------
    # SPA fallback
    # ---------------------------------------------------------------------
    # /search, /chat, /chat/<id> and /documents/<id> are client-side routes with
    # no file behind them. Without this, reloading one of those URLs is a 404
    # from nginx rather than the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
